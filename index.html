/* ----- messages in the form ----- */
function scanSet(kind, html) { const el = $('#f-scan-' + kind, sheet); if (el && el.isConnected) el.innerHTML = html; }
function scanField(sel, val) { const el = $(sel, sheet); if (!el) return; el.value = val; el.dispatchEvent(new Event('input', { bubbles: true })); }
function scanProgress(kind) {
  return m => {
    const p = Math.round((m.progress || 0) * 100), st = String(m.status || '');
    if (/recogniz/i.test(st)) scanSet(kind, '<span class="muted">Reading… ' + p + '%</span>');
    else if (/load|initiali/i.test(st)) scanSet(kind, '<span class="muted">Getting the reader ready' + (Ocr.local ? '' : ' (first time only, about 8 MB)') + '…' + (p ? ' ' + p + '%' : '') + '</span>');
  };
}
function scanThumbHtml(cv) { const t = ocrThumb(cv); return t ? '<img class="scan-thumb" alt="Scanned photo" src="' + t + '">' : ''; }
function scanLastOdo() { const car = getActiveCar(), lr = C && C.lastReal; return Math.max((lr && lr.k) || 0, (car && car.odometer) || 0); }

/* ----- odometer ----- */
async function scanOdoCrop(img, rect, kind) {
  const lastOdo = scanLastOdo();
  const R = { x: rect.x * img.sw, y: rect.y * img.sh, w: Math.max(8, rect.w * img.sw), h: Math.max(8, rect.h * img.sh) };
  let scale = 1000 / R.w; scale = Math.max(0.35, Math.min(3, scale));
  while (R.w * scale * R.h * scale > 1.8e6) scale *= 0.9;
  const w = Math.max(8, Math.round(R.w * scale)), h = Math.max(8, Math.round(R.h * scale));
  const crop = ocrDrawCanvas(img, R.x, R.y, R.w, R.h, w, h, true);
  let cands = [];
  try {                                          // 1) built-in seven-segment reader (offline, nothing to download)
    const g = ocrStretch(ocrToGray(crop.rgba, w * h));
    const res = lcdReadOdometer(g, w, h, lastOdo);
    if (res) cands = res.cands;
  } catch (e) {}
  if (!(cands[0] && cands[0].ok && cands[0].score >= 8)) {   // 2) not sure -> ask the general text reader as well
    try {
      const worker = await ocrWorker();
      await worker.setParameters({ tessedit_char_whitelist: '0123456789.,', tessedit_pageseg_mode: '6', user_defined_dpi: '300' });
      const texts = [];
      for (const v of ocrVariants(crop.rgba, w, h, 'odo')) {
        const r = await worker.recognize(ocrGrayCanvas(v.gray, w, h));
        texts.push(r.data.text);
        const t = ocrOdoCandidates(texts, lastOdo);
        if (t[0] && t[0].ok && t[0].score >= 8) break;
      }
      const t = ocrOdoCandidates(texts, lastOdo), seen = {};
      cands = cands.concat(t).filter(c => seen[c.val] ? false : (seen[c.val] = 1)).sort((a, b) => (b.ok - a.ok) || (b.score - a.score));
    } catch (e) { if (!cands.length) throw e; }
  }
  const good = cands.filter(c => c.ok);
  if (!good.length) {
    scanSet(kind, '<span class="err">Couldn\'t read the odometer reliably. Make the box cover only the digits, or type the value in.</span>');
    return;
  }
  scanField('#f-km', String(good[0].val));
  const chips = good.slice(1, 3).map(c => '<button type="button" class="scan-chip" data-act="scan-use" data-target="#f-km" data-val="' + c.val + '">' + fmt0(c.val) + '</button>').join('');
  scanSet(kind, '<div class="scanwrap">' + scanThumbHtml(crop.cv) + '<div>Read <b>' + fmt0(good[0].val) + ' km</b>. Please check it against your dashboard.' +
    (chips ? '<div class="scan-chips"><span class="muted">Other possibilities:</span>' + chips + '</div>' : '') + '</div></div>');
}
async function runOdoScan(file) {
  if (Ocr.busy) { toast('Still reading the previous photo.'); return; }
  Ocr.busy = true; scanSet('odo', '<span class="muted">Preparing photo…</span>');
  Ocr.onProgress = scanProgress('odo');
  try {
    const img = await ocrOpenImage(file), ar = img.sw / img.sh;
    scanSet('odo', '');
    const rect = await cropPick(img, odoBoxLoad(ar));
    if (!rect) return;
    odoBoxSave(rect, ar);
    scanSet('odo', '<span class="muted">Reading…</span>');
    await scanOdoCrop(img, rect, 'odo');
  } catch (e) {
    const m = String(e && e.message || e);
    scanSet('odo', '<span class="err">' + (m === 'offline'
      ? 'Reading photos needs internet the first time. Connect and try again, or type the value.'
      : 'Couldn\'t read this photo. Please type the value.') + '</span>');
  } finally { Ocr.busy = false; Ocr.onProgress = null; ocrRelease(); }
}

/* ----- fuel bill ----- */
async function scanBill(img, worker, kind) {
  const big = ocrReadFileScaled(img, 'bill');
  await worker.setParameters({ tessedit_char_whitelist: '', tessedit_pageseg_mode: '6', user_defined_dpi: '300' });
  let res = null;
  for (const v of ocrVariants(big.rgba, big.w, big.h, 'bill')) {
    const r = await worker.recognize(ocrGrayCanvas(v.gray, big.w, big.h));
    const p = ocrParseBill(r.data.text);
    if (p && (!res || (p.how === 'matched' && res.how !== 'matched'))) res = p;
    if (res && res.how === 'matched') break;
  }
  if (!res || !(res.amount > 0 || res.rate > 0)) {
    scanSet(kind, '<span class="err">Couldn\'t read the bill. Try a flat, well-lit photo with the whole bill in view, or type the values in.</span>');
    return;
  }
  const parts = [];
  if (res.amount > 0) { scanField('#f-amt', res.amount.toFixed(2)); parts.push('Amount <b>' + res.amount.toFixed(2) + '</b>'); }
  if (res.rate > 0) { scanField('#f-rate', String(res.rate)); parts.push('Rate <b>' + res.rate + '</b>'); }
  if (res.litres > 0) parts.push(res.litres + ' L');
  const missing = !(res.amount > 0) ? 'Amount not found, please type it.' : (!(res.rate > 0) ? 'Rate not found, please type it.' : '');
  scanSet(kind, '<div class="scanwrap">' + scanThumbHtml(big.cv) + '<div>Read from bill: ' + parts.join(' &middot; ') + '. Please check it against the bill.' +
    (res.how === 'keywords' ? ' <span class="muted">Some values were worked out from the bill, so double-check them.</span>' : '') +
    (missing ? ' <span class="err">' + missing + '</span>' : '') + '</div></div>');
}
async function runScan(kind, file) {
  if (kind === 'odo') return runOdoScan(file);
  if (Ocr.busy) { toast('Still reading the previous photo.'); return; }
  Ocr.busy = true; scanSet(kind, '<span class="muted">Preparing photo…</span>');
  Ocr.onProgress = scanProgress(kind);
  try {
    const img = await ocrOpenImage(file);
    const worker = await ocrWorker();
    await scanBill(img, worker, kind);
  } catch (e) {
    const m = String(e && e.message || e);
    scanSet(kind, '<span class="err">' + (m === 'offline'
      ? 'Reading photos needs internet the first time. Connect and try again, or type the value.'
      : 'Couldn\'t read this photo (the reader may not have loaded). Please type the value.') + '</span>');
  } finally { Ocr.busy = false; Ocr.onProgress = null; ocrRelease(); }
}

/* ---------- PAYMENT SHEET LOGIC ---------- */
function paySheet(id, coPref) {
  const car = getActiveCar();
  const ex = id ? (car.payments || []).find(p => p.i === id) : null;
  const v = ex || { d: today(), a: null, n: '', c: coPref || activeCoId() };
  const cos = companies(), selCo = coOfPay(v);
  const coField = cos.length > 1 ? `<fieldset class="field"><legend>Received from</legend><div class="seg2">${cos.map(co => `<label><input type="radio" name="p-co" value="${esc(co.id)}" ${co.id === selCo ? 'checked' : ''}><span>${esc(co.n)}</span></label>`).join('')}</div></fieldset>` : '';
  openSheet('pay', id, ex ? 'Edit payment' : 'Record payment', `
    ${coField}
    <div class="field"><label for="p-date">Date received</label><input id="p-date" type="date" value="${esc(v.d)}"></div>
    <div class="field"><label for="p-amt">Amount (AED)</label><input id="p-amt" type="text" inputmode="decimal" value="${v.a == null ? '' : esc(v.a)}"></div>
    <div class="field"><label for="p-note">Note / Ref (optional)</label><input id="p-note" type="text" maxlength="80" value="${esc(v.n || '')}"></div>
    <p id="p-msg" class="preview" aria-live="polite"></p>
    <div class="actions">
      <button class="btn" data-act="save-pay">Save</button>
      ${ex ? '<button class="btn danger" data-act="del-pay">Delete</button>' : ''}
    </div>
  `);
  if (!ex) $('#p-amt', sheet).focus();
}

function savePay() {
  const id = sheet.dataset.id || null, d = $('#p-date', sheet).value, a = parseNum($('#p-amt', sheet).value), n = $('#p-note', sheet).value.trim();
  const msg = $('#p-msg', sheet);
  if (!d) { msg.className = 'preview err'; msg.textContent = 'Please choose a date.'; return; }
  if (!(a > 0)) { msg.className = 'preview err'; msg.textContent = 'Please enter amount received.'; return; }
  const car = getActiveCar();
  const coSel = sheet.querySelector('input[name=p-co]:checked');
  const row = { i: id || ('p' + uid()), d, a: r2(a), n, c: coSel ? coSel.value : activeCoId() };
  car.payments = id ? car.payments.map(x => x.i === id ? row : x) : (car.payments || []).concat([row]);
  persistAll(); closeSheet(); render(); toast(id ? 'Payment updated successfully' : 'Payment recorded successfully');
}

/* ---------- SERVICE SHEETS ---------- */
function svcById(id) {
  const car = getActiveCar();
  return (car.service || []).find(x => x.i === id);
}

function svcDoneSheet(id) {
  const it = svcById(id); if (!it) return; const c = svcCalc(it);
  openSheet('svc-done', id, it.n + ' Done', `
    <div class="field"><label for="s-km">Odometer at service (km)</label><input id="s-km" type="text" inputmode="numeric" value="${C.odo == null ? '' : esc(C.odo)}"></div>
    <div class="field"><label for="s-int">Next due after (km interval)</label><input id="s-int" type="text" inputmode="numeric" value="${esc(c ? c.last.i : 5000)}"></div>
    <p id="s-msg" class="preview" aria-live="polite"></p>
    <div class="actions"><button class="btn" data-act="save-svc-done">Save</button></div>
  `);
}

function saveSvcDone() {
  const id = sheet.dataset.id, it = svcById(id), km = parseNum($('#s-km', sheet).value), iv = parseNum($('#s-int', sheet).value), msg = $('#s-msg', sheet);
  const c = svcCalc(it);
  if (!(km > 0)) { msg.className = 'preview err'; msg.textContent = 'Please enter odometer reading.'; return; }
  if (!(iv > 0)) { msg.className = 'preview err'; msg.textContent = 'Please enter service interval in km.'; return; }
  if (c && km <= c.last.k) { msg.className = 'preview err'; msg.textContent = 'Odometer must be higher than last service (' + fmt0(c.last.k) + ' km).'; return; }
  const car = getActiveCar();
  car.service = car.service.map(x => x.i === id ? Object.assign({}, x, { h: x.h.concat([{ k: Math.round(km), i: Math.round(iv) }]) }) : x);
  persistAll(); closeSheet(); render(); toast(it.n + ' marked as completed');
}

function svcEditSheet(id) {
  const it = svcById(id); if (!it) return; const c = svcCalc(it);
  openSheet('svc-edit', id, 'Edit ' + it.n, `
    <div class="field"><label for="e-name">Service Name</label><input id="e-name" type="text" maxlength="40" value="${esc(it.n)}"></div>
    <div class="field"><label for="e-int">Interval for next service (km)</label><input id="e-int" type="text" inputmode="numeric" value="${esc(c ? c.last.i : 5000)}"></div>
    <p id="e-msg" class="preview" aria-live="polite"></p>
    <div class="actions">
      <button class="btn" data-act="save-svc-edit">Save</button>
      ${it.h.length > 1 ? '<button class="btn ghost" data-act="svc-undo">Undo last service</button>' : ''}
      <button class="btn danger" data-act="svc-del">Delete reminder</button>
    </div>
  `);
}

function saveSvcEdit() {
  const id = sheet.dataset.id, name = $('#e-name', sheet).value.trim(), iv = parseNum($('#e-int', sheet).value), msg = $('#e-msg', sheet);
  if (!name) { msg.className = 'preview err'; msg.textContent = 'Please enter a name.'; return; }
  if (!(iv > 0)) { msg.className = 'preview err'; msg.textContent = 'Please enter the interval in km.'; return; }
  const car = getActiveCar();
  car.service = car.service.map(x => {
    if (x.i !== id) return x;
    const h = x.h.slice().sort((a, b) => a.k - b.k);
    const l = h.length - 1;
    h[l] = { k: h[l].k, i: Math.round(iv) };
    return Object.assign({}, x, { n: name, h });
  });
  persistAll(); closeSheet(); render(); toast('Reminder updated');
}

function svcAddSheet() {
  openSheet('svc-add', '', 'Add Service Reminder', `
    <div class="field"><label for="a-name">Service Type</label><input id="a-name" type="text" placeholder="e.g. Brake pads, Battery, Transmission"></div>
    <div class="two">
      <div class="field"><label for="a-int">Every (km interval)</label><input id="a-int" type="text" inputmode="numeric" placeholder="e.g. 10000"></div>
      <div class="field"><label for="a-km">Last done at (km)</label><input id="a-km" type="text" inputmode="numeric" value="${C && C.odo != null ? esc(C.odo) : ''}"></div>
    </div>
    <p id="a-msg" class="preview" aria-live="polite"></p>
    <div class="actions"><button class="btn" data-act="save-svc-add">Add Reminder</button></div>
  `);
  $('#a-name', sheet).focus();
}

function saveSvcAdd() {
  const name = $('#a-name', sheet).value.trim(), iv = parseNum($('#a-int', sheet).value), km = parseNum($('#a-km', sheet).value), msg = $('#a-msg', sheet);
  if (!name) { msg.className = 'preview err'; msg.textContent = 'Please enter a service name.'; return; }
  if (!(iv > 0)) { msg.className = 'preview err'; msg.textContent = 'Please enter the interval in km.'; return; }
  if (!(km >= 0)) { msg.className = 'preview err'; msg.textContent = 'Please enter the odometer reading for last service.'; return; }
  const car = getActiveCar();
  car.service = (car.service || []).concat([{ i: 's' + uid(), n: name, h: [{ k: Math.round(km), i: Math.round(iv) }] }]);
  persistAll(); closeSheet(); render(); toast('Service reminder added');
}

  }),
  'svc-add': () => svcAddSheet(),
  'save-svc-add': () => saveSvcAdd(),

  // Dedicated Data Switches
  'export-excel': () => exportToExcel(),
  'import-excel': () => $('#excel-file-input').click(),

  'download-json': () => downloadJsonBackup(),
  'upload-json': () => $('#json-restore-input').click(),
  'open-pdf-range-modal': () => openPdfRangeModal(),
  'confirm-pdf-range': () => confirmPdfRange(),
  'trigger-print': () => window.print(),
  'sync-save-cid': () => {
    const v = ($('#sync-cid') || {}).value; const id = (v || '').trim();
    if (!/^[\w-]+(\.[\w-]+)*\.apps\.googleusercontent\.com$/.test(id)) { toast('That does not look like a valid Google Client ID.'); return; }
    try { localStorage.setItem('carlog.sync.cid', id); } catch (e) {}
    render(); toast('Client ID saved. Now tap Sign in with Google.');
  },
  'sync-signin': () => { syncSignIn(); },
  'sync-now': () => { syncNow(true); },
  'sync-signout': el => confirmTap(el, 'Tap again to sign out', () => {
    clearTimeout(Sync.timer); Sync.token = null; Sync.exp = 0; Sync.msg = '';
    try { localStorage.removeItem('carlog.sync'); } catch (e) {}
    render(); toast('Signed out. Data on this device and in Google Drive is unchanged.');
  }),
  'open-reset-modal': () => openResetModal(),
  'reset-active-car': el => {
    const car = getActiveCar();
    confirmTap(el, 'Tap again to Confirm Reset', () => {
      car.fills = [];
      car.payments = [];
      (car.service || []).forEach(s => {
        s.h = [{ k: car.odometer || 0, i: (s.i === 'tyre' ? 10000 : 5000) }];
      });
      persistAll();
      closeSheet();
      render();
      toast(`Active car (${car.name}) records reset successfully.`);
    });
  },
  'factory-reset': el => {
    confirmTap(el, 'Tap again to Confirm Factory Reset', () => {
      S.cars = [];
      S.activeCarId = null;
      S.cfg.payers = [];
      S.cfg.companyName = 'Company';
      S.cfg.activeCompany = 'C';
      S.meta.lastBackup = null;
      clearTimeout(Sync.timer); Sync.token = null; Sync.exp = 0; Sync.msg = '';
      try { localStorage.removeItem('carlog.sync'); } catch (e) {}
      persistAll();
      closeSheet();
      render();
      toast('All data reset on this device. Google Drive copy (if any) was not touched.');
    });
  }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && H[b.dataset.act]) H[b.dataset.act](b, e);
});

$('#excel-file-input').addEventListener('change', importFromExcel);
$('#json-restore-input').addEventListener('change', restoreFromJson);

sheet.addEventListener('change', e => {
  const t = e.target;
  if (t && t.matches && t.matches('input[type=file][data-scan]')) {
    const f = t.files && t.files[0], kind = t.dataset.scan;
    t.value = '';
    if (f) runScan(kind, f);
  }
});
sheet.addEventListener('input', e => {
  if (sheet.dataset.kind === 'fill') fillPreview();
});
sheet.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target && e.target.id === 'f-payer-name') { e.preventDefault(); H['payer-new-save'](); }
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && syncEnabled() && tokenValid()) syncNow(false);
});
if (syncEnabled()) {
  document.addEventListener('click', () => { if (syncEnabled() && !tokenValid()) syncNow(true); }, { once: true, capture: true });
}

initApp();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js', {scope: './'}).catch(function (err) {
      console.warn('CarLog service worker registration failed:', err);
    });
  });
}
</script>

</body>
